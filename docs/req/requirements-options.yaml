schema_version: "1.0"
project: "CS5351 Group Project - TradingAgents"
updated: "2026-11-09"
source_document: "需求与分工-TradingAgents.md"
notes: >-
  Draft requirements registry. Each requirement must link to an enforcing
  component, at least one test, one runtime monitor, and one demo moment.
  Priority uses MoSCoW. NFRs are expressed as metric + threshold + verification.

requirements:

  # ---------------------------------------------------------------------------
  # A. 决策安全（Owner A）
  # ---------------------------------------------------------------------------

  - id: FR-A1
    type: functional
    category: functional_behavior
    statement: >-
      系统必须在输出任何交易决策前，按版本化风控策略校验 TraderProposal 与
      PortfolioDecision，返回 APPROVED、REJECTED 或 NEEDS_REVIEW，并给出命中规则 ID。
    fit_criterion: >-
      5 个注入违规样本（缺止损、单票超过 10%、行业集中度超过 30%、
      盈亏比低于 1.5、黑名单）5/5 不通过 APPROVED；100% 裁决带规则 ID；
      policy_version 写入运行清单。
    priority: must
    owner: A
    component: "risk_gate"
    source: >-
      基线缺口：TraderProposal.position_sizing 是自由文本；PortfolioDecision
      没有确定性风控校验；论文声称风控在管风险，代码里没有硬规则。
    verification:
      test: "test_risk_gate_violations"
      monitor: "risk_verdict_count"
      demo: "注入坏单，展示被拒绝及规则 ID"
    status: draft

  - id: FR-A2
    type: functional
    category: functional_behavior
    statement: >-
      NEEDS_REVIEW 决策必须进入人工审批，记录审批人、时间、理由；禁止自动通过。
    fit_criterion: >-
      10 个 NEEDS_REVIEW 样本 100% 有审批记录；0 个自动通过。
    priority: should
    owner: A
    component: "risk_gate"
    source: "基线缺口：没有人工审批路径。"
    verification:
      test: "test_needs_review_requires_human_approval"
      monitor: "needs_review_pending_count"
      demo: "展示 NEEDS_REVIEW 被挂起，人工批准后继续"
    status: draft

  - id: INV-A1
    type: invariant
    category: invariant
    statement: >-
      任何缺少止损或超过单票上限的决策不得标为 APPROVED。
    fit_criterion: >-
      100 个违规 fixture 0 放行；回归套件 invariant violation = 0。
    priority: must
    owner: A
    component: "risk_gate"
    source: "基线缺口：无止损/仓位上限的硬校验。"
    verification:
      test: "test_invariant_no_approval_without_stop_loss"
      monitor: "invariant_violations"
      demo: "审计日志显示零容忍规则被触发"
    status: draft

  - id: NFR-A1
    type: non_functional
    category: performance
    statement: >-
      风控评估额外延迟不得超过 2 秒/次，且不得调用外部网络服务。
    fit_criterion: >-
      10 次运行 p95 增量不超过 2 秒；风控模块单测 0 次网络调用。
    priority: must
    owner: A
    component: "risk_gate"
    source: "生产级要求：风控不能成为不可接受的延迟来源。"
    verification:
      test: "test_risk_gate_latency_and_no_network"
      monitor: "risk_gate_latency_ms"
      demo: "展示风控前后耗时对比"
    status: draft

  - id: NFR-A2
    type: non_functional
    category: governance
    statement: >-
      100% 的风控评估必须可审计，至少包含规则 ID、输入快照、裁决、
      policy_version 和时间戳。
    fit_criterion: >-
      10 次运行审计覆盖率 100%；抽样 50 条字段完整率 100%。
    priority: must
    owner: A
    component: "risk_gate"
    source: "课程要求：强可追溯、运行时可审计。"
    verification:
      test: "test_risk_audit_trail_completeness"
      monitor: "risk_audit_coverage"
      demo: "展示一条裁决的完整审计记录"
    status: draft

  - id: FR-A3
    type: functional
    category: functional_behavior
    statement: >-
      风控规则阈值必须可通过配置修改，无需修改代码。
    fit_criterion: >-
      修改一个阈值后，测试全部通过，源码零改动，policy_version 递增。
    priority: could
    owner: A
    component: "risk_gate"
    source: "可选扩展：规则配置化。"
    verification:
      test: "test_risk_policy_config_change"
      monitor: "policy_version"
      demo: "改配置，不动代码，重新运行"
    status: optional

  # ---------------------------------------------------------------------------
  # B. 结论可信（Owner B）
  # ---------------------------------------------------------------------------

  - id: FR-B1
    type: functional
    category: functional_behavior
    statement: >-
      最终决策的关键字段（评级理由、入场价、止损、目标价、仓位）必须各带
      至少一个 EvidenceRef（来源类型、来源 ID、定位、短引用或 hash）。
    fit_criterion: >-
      5 次运行关键字段覆盖率 100%；0 个关键字段在无 ref 时标 SUPPORTED。
    priority: must
    owner: B
    component: "evidence"
    source: "基线缺口：最终决策没有结构化 EvidenceRef，报告是散文。"
    verification:
      test: "test_evidence_coverage"
      monitor: "traceability_coverage"
      demo: "点击一条结论，跳到报告原文"
    status: draft

  - id: FR-B2
    type: functional
    category: functional_behavior
    statement: >-
      无法解析或找不到来源的结论必须标 UNTRACEABLE，且不计入 supported 统计。
    fit_criterion: >-
      5 个注入无出处结论 5/5 标 UNTRACEABLE；supported 计数不含它们。
    priority: must
    owner: B
    component: "evidence"
    source: "基线缺口：无法区分有出处/无出处。"
    verification:
      test: "test_untraceable_claims"
      monitor: "untraceable_count"
      demo: "无出处结论被标记"
    status: draft

  - id: INV-B1
    type: invariant
    category: invariant
    statement: >-
      不允许 SUPPORTED 结论没有有效 EvidenceRef。
    fit_criterion: >-
      回归中 0 个 supported 无 ref；违反时 invariant 测试失败。
    priority: must
    owner: B
    component: "evidence"
    source: "课程要求：强可追溯；防止编造。"
    verification:
      test: "test_invariant_supported_requires_evidence"
      monitor: "invariant_violations"
      demo: "零容忍审计"
    status: draft

  - id: NFR-B1
    type: non_functional
    category: quality_attribute
    statement: >-
      关键字段可追溯率必须为 100%。
    fit_criterion: >-
      coverage = 有 ref 的关键字段数 / 关键字段总数 = 100%，5 次运行。
    priority: must
    owner: B
    component: "evidence"
    source: "课程要求：trace matrix 与可追溯性。"
    verification:
      test: "test_key_field_traceability_rate"
      monitor: "traceability_coverage"
      demo: "覆盖率报表"
    status: draft

  - id: NFR-B2
    type: non_functional
    category: performance
    statement: >-
      证据查询 p95 不得超过 1 秒；单条证据存储不得超过 1KB，不保存全文。
    fit_criterion: >-
      p95 <= 1 秒；payload <= 1KB；evidence store 无全文内容。
    priority: should
    owner: B
    component: "evidence"
    source: "生产级要求：证据链不能拖慢运行或泄漏全文。"
    verification:
      test: "test_evidence_lookup_latency_payload"
      monitor: "evidence_lookup_ms"
      demo: "证据查询"
    status: draft

  - id: FR-B3
    type: functional
    category: functional_behavior
    statement: >-
      系统必须提供 trace 视图（CLI 或 HTML），展示 claim、source type、
      source ID 和 locator/quote。
    fit_criterion: >-
      3 次运行 100% EvidenceRef 可查看；p95 查询 <= 1 秒；视图可导出。
    priority: could
    owner: B
    component: "reporting"
    source: "可选扩展：证据可视化。"
    verification:
      test: "test_trace_view_completeness"
      monitor: "trace_view_coverage"
      demo: "trace 视图"
    status: optional

  # ---------------------------------------------------------------------------
  # C. 成本可控（Owner C）
  # ---------------------------------------------------------------------------

  - id: FR-C1
    type: functional
    category: functional_behavior
    statement: >-
      每次运行必须有可配置 token 预算；预计超标时先压缩上下文，再在硬上限前
      停止；记录压缩/停止原因和用量。
    fit_criterion: >-
      10 次预算 120k 运行，0 次超硬上限；100% 记录原因；
      产出 BUDGET_STOP 或正常评级。
    priority: must
    owner: C
    component: "token_budget"
    source: >-
      基线缺口：单次全量 195,192 tokens；没有预算/熔断。
    verification:
      test: "test_budget_cutoff"
      monitor: "run_tokens"
      demo: "成本前后对比"
    status: draft

  - id: FR-C2
    type: functional
    category: functional_behavior
    statement: >-
      未配置或无凭据的数据源必须跳过并记录，不得在同一次运行中重试。
    fit_criterion: >-
      缺 FRED key 时 0 次重试；每次运行 1 条 skip 日志；运行不失败。
    priority: must
    owner: C
    component: "vendor_router"
    source: "基线缺口：FRED 未配 key 时无效重试 7 次。"
    verification:
      test: "test_vendor_skip_on_missing_key"
      monitor: "vendor_skip_count"
      demo: "FRED 重试 7 次降到 0"
    status: draft

  - id: FR-C3
    type: functional
    category: functional_behavior
    statement: >-
      运行清单必须按 agent/阶段记录 token（输入/输出/总）、调用次数和延迟。
    fit_criterion: >-
      100% 运行有分 agent 记录；sum 与总 token 误差 <= 1%；JSON 可导出。
    priority: must
    owner: C
    component: "usage_ledger"
    source: "基线缺口：没有分 agent 用量。"
    verification:
      test: "test_usage_ledger_per_agent"
      monitor: "tokens_per_agent"
      demo: "分 agent 用量表"
    status: draft

  - id: NFR-C1
    type: non_functional
    category: cost
    statement: >-
      固定案例单次全量运行 token 必须低于 120,000（基线 195,192）。
    fit_criterion: >-
      3 次运行均值低于 120k；最大值低于 130k。
    priority: must
    owner: C
    component: "token_budget"
    source: "课程高分点：运行侧 token 更低。"
    verification:
      test: "test_token_budget_fixed_case"
      monitor: "run_tokens"
      demo: "token 前后对比"
    status: draft

  - id: NFR-C2
    type: non_functional
    category: performance
    statement: >-
      固定案例单次运行时间不得超过 150 秒（基线 131.4 秒）。
    fit_criterion: >-
      3 次运行 p95 <= 150 秒。
    priority: should
    owner: C
    component: "token_budget"
    source: "生产级要求：成本治理不能以不可接受的延迟为代价。"
    verification:
      test: "test_latency_fixed_case"
      monitor: "run_latency_s"
      demo: "耗时对比"
    status: draft

  - id: FR-C4
    type: functional
    category: functional_behavior
    statement: >-
      下游报告超过大小阈值时必须压缩或摘要，保留关键结论和证据引用。
    fit_criterion: >-
      报告体积降低至少 30%；关键结论和证据引用保留 100%；
      5 个案例中至少 3 个评级不变。
    priority: could
    owner: C
    component: "report_compression"
    source: "可选扩展：报告压缩。"
    verification:
      test: "test_report_compression_preserves_evidence"
      monitor: "report_size_bytes"
      demo: "压缩前后对比"
    status: optional

  # ---------------------------------------------------------------------------
  # D. 失败可见（Owner D）
  # ---------------------------------------------------------------------------

  - id: FR-D1
    type: functional
    category: functional_behavior
    statement: >-
      三个决策 agent（Research Manager、Trader、Portfolio Manager）必须统一走
      function calling 结构化输出，不依赖 json_schema。
    fit_criterion: >-
      10 次运行 0 次 json_schema 调用；100% 结构化尝试走 function calling；
      schema 校验通过率 >= 95%。
    priority: must
    owner: D
    component: "structured_adapter"
    source: >-
      基线缺口：CityU 网关不支持 json_schema；必须走 function calling。
    verification:
      test: "test_function_calling_adapter"
      monitor: "structured_success_rate"
      demo: "0 次 json_schema 调用"
    status: draft

  - id: FR-D2
    type: functional
    category: functional_behavior
    statement: >-
      结构化输出无解析结果或校验失败时必须重试 1 次；仍失败则标 DEGRADED，
      并继续运行。
    fit_criterion: >-
      强制失败 fixture 触发 1 次重试；报告/日志有 DEGRADED；
      0 次无标记降级。
    priority: must
    owner: D
    component: "structured_adapter"
    source: >-
      基线缺口：全量日志明确 2 次结构化输出静默降级。
    verification:
      test: "test_degraded_marker"
      monitor: "degradation_count"
      demo: "降级标记可见"
    status: draft

  - id: FR-D3
    type: functional
    category: functional_behavior
    statement: >-
      工具调用必须被准确计数，记录工具名、开始/结束、状态和每次运行次数。
    fit_criterion: >-
      计数与插桩真值误差为 0；缓存数据测试至少 1 次调用；
      基线 0 计数 bug 修复。
    priority: must
    owner: D
    component: "stats_callback"
    source: >-
      基线缺口：tool_calls 恒为 0，但缓存实际有 1255 行行情数据。
    verification:
      test: "test_tool_call_counting"
      monitor: "tool_calls_total"
      demo: "计数与实际一致"
    status: draft

  - id: INV-D1
    type: invariant
    category: invariant
    statement: >-
      任何结构化输出失败都必须显式标记 DEGRADED，不允许静默降级。
    fit_criterion: >-
      20 次强制失败 0 次静默；事件数等于降级次数。
    priority: must
    owner: D
    component: "structured_adapter"
    source: "课程要求：失败路径必须可见。"
    verification:
      test: "test_invariant_no_silent_degradation"
      monitor: "invariant_violations"
      demo: "零静默降级审计"
    status: draft

  - id: NFR-D1
    type: non_functional
    category: quality_attribute
    statement: >-
      固定评测集上必须 0 次静默降级。
    fit_criterion: >-
      10 次运行 0 次未标记降级；强制降级时 100% 可见。
    priority: must
    owner: D
    component: "structured_adapter"
    source: "课程要求：可靠性与可观测性。"
    verification:
      test: "test_zero_silent_degradation_on_eval"
      monitor: "degradation_count"
      demo: "评测集 0 降级"
    status: draft

  - id: FR-D4
    type: functional
    category: functional_behavior
    statement: >-
      DEGRADED 状态必须传递到最终报告和退出状态。
    fit_criterion: >-
      100% 降级运行最终报告含 DEGRADED；退出码或状态字段设置。
    priority: could
    owner: D
    component: "reporting"
    source: "可选扩展：降级状态传播。"
    verification:
      test: "test_degraded_propagation"
      monitor: "degraded_status"
      demo: "报告与退出状态"
    status: optional

  - id: NFR-D2
    type: non_functional
    category: performance
    statement: >-
      可观测开销不得超过 5% 运行时间、2% token。
    fit_criterion: >-
      有/无插桩对比，开销在阈值内。
    priority: could
    owner: D
    component: "instrumentation"
    source: "可选扩展：可观测性开销。"
    verification:
      test: "test_observability_overhead"
      monitor: "overhead_pct"
      demo: "开销对比"
    status: optional

  # ---------------------------------------------------------------------------
  # E. 整体可验证（Owner E）
  # ---------------------------------------------------------------------------

  - id: FR-E1
    type: functional
    category: functional_behavior
    statement: >-
      系统必须提供固定 golden set 3–5 个（ticker, date）及缓存数据快照；
      一条命令跑完并导出 before/after 对比表。
    fit_criterion: >-
      100% 案例执行；JSON/CSV 导出；对比表生成。
    priority: must
    owner: E
    component: "eval_harness"
    source: "基线缺口：没有固定评测集。"
    verification:
      test: "test_golden_set"
      monitor: "eval_pass_rate"
      demo: "before/after 表"
    status: draft

  - id: FR-E2
    type: functional
    category: functional_behavior
    statement: >-
      每次评测运行必须记录 manifest：commit、model、prompt hash、config、
      data snapshot、tokens、latency、degradations、risk verdicts 和
      traceability。
    fit_criterion: >-
      100% manifest 完整；schema 校验通过；同 manifest 重跑评级稳定、
      指标波动 <= 5%。
    priority: must
    owner: E
    component: "run_manifest"
    source: "基线缺口：没有 run manifest。"
    verification:
      test: "test_run_manifest_completeness"
      monitor: "manifest_completeness"
      demo: "manifest 展示"
    status: draft

  - id: FR-E3
    type: functional
    category: functional_behavior
    statement: >-
      CI 必须配置六道 blocking gates：test approval、static analysis、
      schema、semantic eval、regression 和 AI-use log。
    fit_criterion: >-
      6/6 配置；每个 gate 用故意坏 PR 验证能拦；好 PR 全过。
    priority: must
    owner: E
    component: "ci_gates"
    source: "课程要求：六道 blocking gate。"
    verification:
      test: "test_ci_six_gates"
      monitor: "ci_gate_status"
      demo: "坏 PR 被拦"
    status: draft

  - id: INV-E1
    type: invariant
    category: invariant
    statement: >-
      任一 blocking gate 失败不得合并；仓库不得包含 secret。
    fit_criterion: >-
      分支保护要求 6 项检查；secret 扫描 0 发现；坏 PR 被拦。
    priority: must
    owner: E
    component: "ci_gates"
    source: "课程红线：blocking gates 与 secret 管理。"
    verification:
      test: "test_invariant_no_merge_with_failing_gate"
      monitor: "gate_failures"
      demo: "分支保护与拦截"
    status: draft

  - id: NFR-E1
    type: non_functional
    category: performance
    statement: >-
      离线全量评测不得超过 10 分钟。
    fit_criterion: >-
      3 次运行 p95 <= 10 分钟；离线套件无网络调用。
    priority: should
    owner: E
    component: "eval_harness"
    source: "生产级要求：评测要能在 CI 中稳定运行。"
    verification:
      test: "test_offline_eval_runtime"
      monitor: "offline_eval_s"
      demo: "离线评测"
    status: draft

  - id: FR-E4
    type: functional
    category: functional_behavior
    statement: >-
      系统必须支持离线回放录制的 LLM 响应，用于无网络的确定性测试。
    fit_criterion: >-
      断网状态下离线套件 100% 通过；运行时间 <= 5 分钟。
    priority: could
    owner: E
    component: "replay_harness"
    source: "可选扩展：确定性回放。"
    verification:
      test: "test_offline_replay_deterministic"
      monitor: "replay_pass_rate"
      demo: "断网测试"
    status: optional

  - id: NFR-E2
    type: non_functional
    category: quality_attribute
    statement: >-
      Demo 必须能从干净 checkout 用一条命令复现。
    fit_criterion: >-
      干净环境运行成功；demo 脚本完成；对比表生成。
    priority: could
    owner: E
    component: "demo_harness"
    source: "可选扩展：demo 可复现。"
    verification:
      test: "test_demo_reproducible_clean_checkout"
      monitor: "demo_repro_status"
      demo: "干净环境重跑"
    status: optional

  # ---------------------------------------------------------------------------
  # 共享治理 / 安全（Owner E, with D）
  # ---------------------------------------------------------------------------

  - id: NFR-GOV-01
    type: non_functional
    category: governance
    statement: >-
      所有代码变更必须由 AI coding agent 生成，并记录 AI-use log；
      禁止手工修改生成代码。
    fit_criterion: >-
      10 个 PR 100% 有 AI-use log；抽查 10 个 commit 均可追溯到 agent 会话。
    priority: must
    owner: E
    component: "ai_use_log"
    source: "课程红线：no non-agentic modification。"
    verification:
      test: "test_ai_use_log_coverage"
      monitor: "ai_use_log_coverage"
