name: CI

on:
  push:
    branches: [main, 'v[0-9]+.[0-9]+.[0-9]+']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate 5: regression — the full prior test suite still passes.
  # Keeps the Python matrix so a version-specific regression is caught.
  gate-5-regression:
    name: gate-5-regression (py${{ matrix.python-version }}${{ matrix.tz && format(', {0}', matrix.tz) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # One run away from UTC, so a test that only passes in UTC fails here.
        include:
          - python-version: "3.12"
            tz: America/New_York
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Regression gate
        run: python scripts/ci/check_regression.py

  # Gate 2: static analysis — lint, dependency check, compile.
  gate-2-static-analysis:
    name: gate-2-static-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Static-analysis gate
        # ruff + pip check + compileall. Type-check/contract/security/permission
        # checks are NOT covered; the script prints this explicitly.
        run: python scripts/ci/check_static_analysis.py

  # Gate 3: schema — requirements registry validates against its JSON schema.
  gate-3-schema:
    name: gate-3-schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Schema gate
        run: python scripts/ci/check_schema.py

  # Gate 4: semantic eval — fixed golden set still yields expected output.
  gate-4-semantic-eval:
    name: gate-4-semantic-eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Semantic-eval gate
        run: python scripts/ci/check_semantic_eval.py

  # Gate 1: test-approval — a human approval record must be complete.
  # Only on pull requests: it guards a change, not a push to main.
  gate-1-test-approval:
    name: gate-1-test-approval
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test-approval gate
        run: python scripts/ci/check_test_approval.py

  # Gate 6: AI-use log — a code/prompt change must update docs/ai-use-log.yaml.
  # Only on pull requests: the diff is the PR's changed files.
  gate-6-ai-use-log:
    name: gate-6-ai-use-log
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the merge-base diff against the PR base works.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Build changed-file list
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}" || true
          git diff --name-only \
            "origin/${{ github.base_ref }}...${{ github.sha }}" > changed-files.txt \
            || git diff --name-only "HEAD^" > changed-files.txt
          echo "Changed files:"; cat changed-files.txt
      - name: AI-use log gate
        run: python scripts/ci/check_ai_use_log.py --changed-file-list changed-files.txt

  # Clean-install smoke: a bare install (no dev extras) still imports.
  smoke-install:
    name: clean-install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fresh install (no dev extras) and import
        run: |
          python -m pip install --upgrade pip
          pip install .
          # Catches undeclared runtime deps (e.g. #994 python-dotenv): a bare
          # install must import the package and the CLI module.
          python -c "import tradingagents, cli.main; print('clean-install import OK')"
